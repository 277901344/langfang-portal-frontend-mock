# 开发环境配置
server:
  port: ${SERVER_PORT:18191}
  servlet:
    context-path: /

spring:
  config:
    import:
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}?group=local&refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}?group=local&refreshEnabled=true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    # trading 与 connector 共用数据库实例，独立 schema=trading
    url: ${TRADING_LOCAL_DB_JDBC_URL:jdbc:postgresql://172.16.0.212:5432/connector?currentSchema=trading&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8}
    username: sde
    password: SM4:d34f60a36af7293a57372b0e1647404a
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控统计配置
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
        wall:
          enabled: true
          config:
            multi-statement-allow: true

trading:
  platform-auth:
    # 本地联调默认直连本机 SP；如需切回服务发现，可通过环境变量覆盖
    base-url: ${TRADING_PLATFORM_AUTH_BASE_URL:http://127.0.0.1:18181}
    captcha-path: ${TRADING_PLATFORM_AUTH_CAPTCHA_PATH:/auth/captcha}
    login-path: ${TRADING_PLATFORM_AUTH_LOGIN_PATH:/auth/login}
  marketplace:
    catalog:
      base-url: ${TRADING_MARKETPLACE_CATALOG_BASE_URL:${TRADING_PLATFORM_AUTH_BASE_URL:http://127.0.0.1:18181}}
      search-path: ${TRADING_MARKETPLACE_CATALOG_SEARCH_PATH:/catalogService/search}
      detail-path: ${TRADING_MARKETPLACE_CATALOG_DETAIL_PATH:/catalogService/detail}

# 开发环境日志级别
logging:
  level:
    root: INFO
    com.zhzj.trading: DEBUG
    com.baomidou.mybatisplus: DEBUG
    com.baomidou.mybatisplus.core.MybatisConfiguration: DEBUG

oss:
  client:
    endpoint: http://172.16.0.73:19000/
    access-key: myadmin
    secret-key: SM4:9262fded7d84521864b00eb0944cd793
    bucket: tds
    path-style-access: true
